services:
  jenkins:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: jenkins-jcasc
    restart: unless-stopped
    ports:
      - "18080:8080"
      - "50000:50000"
    environment:
      - CASC_JENKINS_CONFIG=/var/jenkins_home/casc_configs/jenkins.yaml
      - SONAR_HOST_URL=https://sonar.devopsatolyesi.com
      - SONAR_TOKEN=${SONAR_TOKEN}
      - PLATFORM_ADMIN_PASSWORD=${PLATFORM_ADMIN_PASSWORD:-BilgincIT454}
      - HARBOR_USER=${HARBOR_USER:-admin}
      - HARBOR_PASS=${HARBOR_PASS:-BilgincIT454}
    volumes:
      - ./jenkins.yaml:/var/jenkins_home/casc_configs/jenkins.yaml:ro
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock

volumes:
  jenkins_home:
