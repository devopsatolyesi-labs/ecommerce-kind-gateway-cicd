# ==============================================================================
# Blue & Green Deployments and Services for Online Boutique Frontend
# Demonstrates Zero-Downtime Blue-Green Cutover via Kubernetes Gateway API
# ==============================================================================

# ----------------- BLUE DEPLOYMENT & SERVICE (v1 / Current Production) -----------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-blue
  namespace: default
  labels:
    app: frontend-blue
    version: blue
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend-blue
  template:
    metadata:
      labels:
        app: frontend-blue
        version: blue
    spec:
      serviceAccountName: frontend
      containers:
        - name: server
          image: online-boutique-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: PORT
              value: "8080"
            - name: PRODUCT_CATALOG_SERVICE_ADDR
              value: "productcatalogservice:3550"
            - name: CURRENCY_SERVICE_ADDR
              value: "currencyservice:7000"
            - name: CART_SERVICE_ADDR
              value: "cartservice:7070"
            - name: RECOMMENDATION_SERVICE_ADDR
              value: "recommendationservice:8080"
            - name: SHIPPING_SERVICE_ADDR
              value: "shippingservice:50051"
            - name: CHECKOUT_SERVICE_ADDR
              value: "checkoutservice:5050"
            - name: AD_SERVICE_ADDR
              value: "adservice:9555"
            - name: ENV_PLATFORM
              value: "gcp"
            - name: BANNER_COLOR
              value: "#1a73e8" # Royal Blue
            - name: FRONTEND_MESSAGE
              value: "🔵 [BLUE VERSION — PRODUCTION] v1.0.0 (Google Online Boutique)"
            - name: CYMBAL_BRANDING
              value: "false"
          readinessProbe:
            initialDelaySeconds: 10
            httpGet:
              path: "/_healthz"
              port: 8080
          livenessProbe:
            initialDelaySeconds: 10
            httpGet:
              path: "/_healthz"
              port: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: frontend-blue
  namespace: default
  labels:
    app: frontend-blue
spec:
  type: ClusterIP
  selector:
    app: frontend-blue
  ports:
    - name: http
      port: 80
      targetPort: 8080

---
# ----------------- GREEN DEPLOYMENT & SERVICE (v2 / New Release) -----------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-green
  namespace: default
  labels:
    app: frontend-green
    version: green
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend-green
  template:
    metadata:
      labels:
        app: frontend-green
        version: green
    spec:
      serviceAccountName: frontend
      containers:
        - name: server
          image: online-boutique-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: PORT
              value: "8080"
            - name: PRODUCT_CATALOG_SERVICE_ADDR
              value: "productcatalogservice:3550"
            - name: CURRENCY_SERVICE_ADDR
              value: "currencyservice:7000"
            - name: CART_SERVICE_ADDR
              value: "cartservice:7070"
            - name: RECOMMENDATION_SERVICE_ADDR
              value: "recommendationservice:8080"
            - name: SHIPPING_SERVICE_ADDR
              value: "shippingservice:50051"
            - name: CHECKOUT_SERVICE_ADDR
              value: "checkoutservice:5050"
            - name: AD_SERVICE_ADDR
              value: "adservice:9555"
            - name: ENV_PLATFORM
              value: "azure"
            - name: BANNER_COLOR
              value: "#059669" # Emerald Green
            - name: FRONTEND_MESSAGE
              value: "🟢 [GREEN VERSION — NEXT-GEN STORE] v2.0.0 (Cymbal Modern Shops)"
            - name: CYMBAL_BRANDING
              value: "true"
          readinessProbe:
            initialDelaySeconds: 10
            httpGet:
              path: "/_healthz"
              port: 8080
          livenessProbe:
            initialDelaySeconds: 10
            httpGet:
              path: "/_healthz"
              port: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: frontend-green
  namespace: default
  labels:
    app: frontend-green
spec:
  type: ClusterIP
  selector:
    app: frontend-green
  ports:
    - name: http
      port: 80
      targetPort: 8080
