global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - "/etc/prometheus/alert.rules.yml"

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - "training-alertmanager:9093"

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "node-exporter"
    static_configs:
      - targets: ["training-node-exporter:9100"]

  - job_name: "traefik-gateway-api"
    metrics_path: /metrics
    static_configs:
      - targets: ["ecommerce-kind-cluster-control-plane:30080", "172.17.0.1:18081"]

  - job_name: "online-boutique-frontend"
    metrics_path: /_healthz
    static_configs:
      - targets: ["ecommerce-kind-cluster-control-plane:30080"]
