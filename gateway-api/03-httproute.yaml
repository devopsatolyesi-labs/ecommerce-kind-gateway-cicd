apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: frontend-route
  namespace: default
  labels:
    app.kubernetes.io/name: frontend-route
    app.kubernetes.io/part-of: online-boutique
spec:
  parentRefs:
    - name: boutique-gateway
      namespace: default
  hostnames:
    - "ecommerce.devopsatolyesi.com"
    - "localhost"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: frontend
          port: 80
          weight: 100
