# ==============================================================================
# Self-Hosted Kubernetes GitHub Actions Runner (Actions Runner Controller / ARC)
# Eliminates GitHub Actions minute billing by executing jobs inside the K8s cluster
# ==============================================================================

apiVersion: v1
kind: Namespace
metadata:
  name: actions-runner-system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: github-self-hosted-runner
  namespace: actions-runner-system
  labels:
    app: github-runner
spec:
  replicas: 1
  selector:
    matchLabels:
      app: github-runner
  template:
    metadata:
      labels:
        app: github-runner
    spec:
      containers:
        - name: runner
          image: my-actions-runner:latest
          env:
            - name: GITHUB_REPOSITORY
              value: "devopsatolyesi-labs/ecommerce-kind-gateway-cicd"
            - name: RUNNER_LABELS
              value: "self-hosted,kubernetes,kind"
            - name: GITHUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: runner-github-secret
                  key: token
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1.5Gi"
