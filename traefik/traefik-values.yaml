# ==============================================================================
# Traefik v3 Official Helm Chart Values (Gateway API Enabled)
# ==============================================================================

deployment:
  enabled: true
  replicas: 1

providers:
  kubernetesCRD:
    enabled: true
    allowCrossNamespace: true
  kubernetesIngress:
    enabled: false
  kubernetesGateway:
    enabled: true
    statusAddress:
      ip: "127.0.0.1"

experimental:
  kubernetesGateway:
    enabled: true

ports:
  web:
    port: 8000
    expose:
      default: true
    exposedPort: 80
    nodePort: 30080
  websecure:
    port: 8443
    expose:
      default: true
    exposedPort: 443
    nodePort: 30443
  traefik:
    port: 9000
    expose:
      default: true
    exposedPort: 9000

ingressClass:
  enabled: false

gatewayClass:
  enabled: true
  name: traefik
  controllerName: traefik.io/gateway-controller

dashboard:
  enabled: true

metrics:
  prometheus:
    enabled: true
    addRoutersLabels: true
    addServicesLabels: true

logs:
  general:
    level: INFO
    format: json
  access:
    enabled: true
    format: json

resources:
  requests:
    cpu: "100m"
    memory: "128Mi"
  limits:
    cpu: "500m"
    memory: "512Mi"
