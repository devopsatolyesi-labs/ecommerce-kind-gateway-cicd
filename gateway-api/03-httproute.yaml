# ==============================================================================
# Kubernetes Gateway API HTTPRoute for Google Online Boutique
# Routes external traffic to frontend microservice via Traefik Gateway
# ==============================================================================

apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: frontend-route
  namespace: default
  labels:
    app.kubernetes.io/name: online-boutique-frontend
spec:
  parentRefs:
    - name: traefik-gateway
      namespace: traefik
      sectionName: web
  hostnames:
    - "student100-app1.devopsatolyesi.com"
    - "student100-k8s-app1.devopsatolyesi.com"
    - "student100-kind.devopsatolyesi.com"
    - "ecommerce-kind.devopsatolyesi.com"
    - "localhost"
    - "127.0.0.1"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: frontend
          port: 80
          weight: 1
