groups:
  - name: ecommerce-gateway-alerts
    rules:
      - alert: GatewayHighErrorRate
        expr: (sum(rate(traefik_entrypoint_requests_total{code=~"5.*"}[5m])) / sum(rate(traefik_entrypoint_requests_total[5m]))) * 100 > 5
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Traefik Gateway API High HTTP 5xx Error Rate"
          description: "Gateway 5xx error rate is above 5% for more than 2 minutes."

      - alert: GatewayLatencyHigh
        expr: histogram_quantile(0.95, sum(rate(traefik_entrypoint_request_duration_seconds_bucket[5m])) by (le)) > 0.5
        for: 3m
        labels:
          severity: warning
        annotations:
          summary: "Traefik Gateway Latency High (p95 > 500ms)"
          description: "95th percentile latency across Traefik Gateway routes exceeds 500ms."

      - alert: ServiceInstanceDown
        expr: up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Target instance {{ $labels.instance }} down"
          description: "Prometheus scraping target {{ $labels.job }} is unreachable for > 1 minute."

      - alert: HostMemoryLow
        expr: (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) * 100 < 15
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Host available RAM below 15%"
          description: "System available memory has dropped below 15%."
