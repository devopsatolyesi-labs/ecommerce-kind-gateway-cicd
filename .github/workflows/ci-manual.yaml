name: CI/CD Pipeline (Manual Approval)

# Manual execution only to preserve GitHub Action quota
on:
  workflow_dispatch:
    inputs:
      target_registry:
        description: "Target Container Registry"
        required: true
        default: "harbor"
        type: choice
        options:
          - "harbor"
          - "nexus"
          - "aws-ecr"
      deploy_to_k8s:
        description: "Deploy to Kubernetes after successful test & security gate?"
        required: true
        default: false
        type: boolean

jobs:
  test-and-scan:
    name: 1. Unit Tests & SonarQube Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Run Unit Tests
        run: |
          cd src/frontend
          go test -v -cover ./...

  security-gate:
    name: 2. Trivy Security Scan
    needs: test-and-scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Docker Image locally
        run: |
          cd src/frontend
          docker build -t online-boutique-frontend:${{ github.sha }} .

      - name: Run Trivy Vulnerability Scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'online-boutique-frontend:${{ github.sha }}'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL'

  publish-and-deploy:
    name: 3. Container Registry Push & Rollout
    needs: security-gate
    runs-on: ubuntu-latest
    if: inputs.deploy_to_k8s == true
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Push to Harbor (On-Prem / GCP)
        if: inputs.target_registry == 'harbor'
        run: |
          echo "Logging into Harbor Registry at ${{ vars.HARBOR_URL }}..."
          echo "${{ secrets.HARBOR_PASSWORD }}" | docker login ${{ vars.HARBOR_URL }} -u "${{ secrets.HARBOR_USERNAME }}" --password-stdin
          docker tag online-boutique-frontend:${{ github.sha }} ${{ vars.HARBOR_URL }}/ecommerce/online-boutique-frontend:latest
          docker push ${{ vars.HARBOR_URL }}/ecommerce/online-boutique-frontend:latest

      - name: Push to AWS ECR (Cloud)
        if: inputs.target_registry == 'aws-ecr'
        run: |
          echo "Configuring AWS credentials and logging into Amazon ECR..."
          # aws ecr get-login-password --region ${{ vars.AWS_REGION }} | docker login --username AWS --password-stdin ${{ secrets.AWS_ECR_REGISTRY }}
          # docker tag online-boutique-frontend:${{ github.sha }} ${{ secrets.AWS_ECR_REGISTRY }}/online-boutique-frontend:latest
          # docker push ${{ secrets.AWS_ECR_REGISTRY }}/online-boutique-frontend:latest

      - name: Deploy to Kubernetes via Traefik Gateway API
        run: |
          chmod +x scripts/*.sh
          ./scripts/setup-traefik-gateway.sh
          ./scripts/deploy-boutique.sh
          ./scripts/validate.sh
