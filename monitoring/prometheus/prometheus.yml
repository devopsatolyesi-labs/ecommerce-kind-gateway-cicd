global:
  scrape_interval: 10s
  evaluation_interval: 10s

rule_files:
  - "/etc/prometheus/alert.rules.yml"

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - "training-alertmanager:9093"

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "node-exporter-host"
    static_configs:
      - targets: ["training-node-exporter:9100"]

  - job_name: "cadvisor-containers-and-pods"
    static_configs:
      - targets: ["training-cadvisor:8080"]

  - job_name: "traefik-gateway-api"
    metrics_path: /metrics
    static_configs:
      - targets: ["ecommerce-kind-cluster-control-plane:30100"]
