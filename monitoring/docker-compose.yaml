services:
  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: training-prometheus
    restart: unless-stopped
    ports:
      - "127.0.0.1:19090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alert.rules.yml:/etc/prometheus/alert.rules.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-lifecycle"
    networks:
      - training-net
      - kind

  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: training-alertmanager
    restart: unless-stopped
    ports:
      - "127.0.0.1:19093:9093"
    networks:
      - training-net

  node-exporter:
    image: prom/node-exporter:v1.8.2
    container_name: training-node-exporter
    restart: unless-stopped
    ports:
      - "127.0.0.1:19100:9100"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - "--path.procfs=/host/proc"
      - "--path.rootfs=/rootfs"
      - "--path.sysfs=/host/sys"
      - "--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)"
    networks:
      - training-net

  grafana:
    image: grafana/grafana:11.2.0
    container_name: training-grafana
    restart: unless-stopped
    ports:
      - "127.0.0.1:13000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=BilgincIT454
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=https://student100-grafana.devopsatolyesi.com/
      - GF_INSTALL_PLUGINS=grafana-piechart-panel
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./grafana/dashboards:/etc/grafana/dashboards:ro
    networks:
      - training-net

volumes:
  prometheus_data:
  grafana_data:

networks:
  training-net:
    external: true
  kind:
    external: true
