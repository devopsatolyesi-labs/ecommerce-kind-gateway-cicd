# ==============================================================================
# Traefik v3 Helm Chart Configuration with Kubernetes Gateway API Support
# ==============================================================================

deployment:
  enabled: true
  replicas: 1

providers:
  kubernetesCRD:
    enabled: true
  kubernetesIngress:
    enabled: true
  kubernetesGateway:
    enabled: true
    experimentalChannel: false

gatewayClass:
  enabled: true

gateway:
  enabled: true
  listeners:
    web:
      port: 8000
      protocol: HTTP
      routes:
        namespaces:
          from: All

service:
  enabled: true
  type: NodePort

ports:
  web:
    port: 8000
    expose:
      default: true
    exposedPort: 80
    nodePort: 30080
    protocol: TCP
  websecure:
    port: 8443
    expose:
      default: true
    exposedPort: 443
    protocol: TCP

api:
  dashboard: true
  insecure: true

logs:
  general:
    level: INFO

metrics:
  prometheus:
    enabled: true
    addEntryPointsLabels: true
    addRoutersLabels: true
    addServicesLabels: true
